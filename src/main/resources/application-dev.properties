# DataSource (dev local — credentials par défaut alignés sur docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/takalo_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin123}

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway — pratique en local pour adopter un schéma existant
spring.flyway.baseline-on-migrate=true

# OAuth2 Resource Server — Keycloak local (realm "takalo")
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/takalo}

